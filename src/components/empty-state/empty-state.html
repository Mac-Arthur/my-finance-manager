<section class="glass-surface rounded-box px-6 py-14 text-center reveal">
  <span class="mx-auto mb-5 grid size-16 place-items-center rounded-2xl bg-primary/15 text-base-content"><app-icon [path]="icons.wallet" class="size-7" /></span>
  <h2 class="text-xl font-semibold tracking-tight">{{ title() }}</h2>
  <p class="mx-auto mt-3 max-w-md text-sm leading-relaxed text-base-content/60">{{ description() }}</p>
  <a [routerLink]="link()" class="btn btn-neutral mt-6 rounded-full px-6"><app-icon [path]="icons.upload" class="size-4" />{{ action() }}</a>
</section>
