<header class="sticky top-2 z-50">
  <nav class="glass-surface flex items-center justify-between gap-3 rounded-full py-1.5 pr-1.5 pl-2">
    <!-- Brand -->
    <a routerLink="/home" class="flex min-w-0 items-center gap-2 pl-1">
      <img src="logo-mark.svg" alt="" class="size-8 shrink-0 rounded-[.65rem]" />
      <span class="truncate text-base font-semibold tracking-tight">
        my<span class="font-normal text-base-content/60">Available</span>
      </span>
    </a>

    <!-- Tabs: desktop only (lg+). Below that they live in the hamburger menu. -->
    <div class="nav-track hidden items-center gap-0.5 rounded-full p-1 lg:flex">
      @for (tab of tabs; track tab.path) {
        <a [routerLink]="tab.path" routerLinkActive="nav-tab-active" class="nav-tab">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="tab.icon" />
          </svg>
          {{ tab.label }}
        </a>
      }
    </div>

    <!-- Actions -->
    <div class="flex shrink-0 items-center gap-1.5">
      <!-- Theme switch: sun = light, moon = dark -->
      <button
        type="button"
        role="switch"
        class="theme-switch"
        [attr.aria-checked]="theme.isDark()"
        aria-label="Dark mode"
        (click)="theme.toggle()"
      >
        <span class="theme-switch__knob"></span>
        <span class="theme-switch__icon theme-switch__icon--sun" [attr.data-on]="!theme.isDark()">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </span>
        <span class="theme-switch__icon theme-switch__icon--moon" [attr.data-on]="theme.isDark()">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </span>
      </button>

      <a routerLink="/settings" routerLinkActive="profile-link--active" class="profile-link" aria-label="Profile and settings">{{ setup.initials() }}</a>

      <!-- Hamburger: everything below lg (phones, tablets, Duo/fold devices) -->
      <button
        type="button"
        class="nav-icon-btn lg:hidden"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobile-menu"
        aria-label="Menu"
        (click)="mobileOpen.set(!mobileOpen())"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <!-- Morphs into an X when open -->
          <path class="origin-center transition-transform duration-300" [class]="mobileOpen() ? 'translate-y-1.5 rotate-45' : ''" d="M4 6h16" />
          <path class="transition-opacity duration-200" [class.opacity-0]="mobileOpen()" d="M4 12h16" />
          <path class="origin-center transition-transform duration-300" [class]="mobileOpen() ? '-translate-y-1.5 -rotate-45' : ''" d="M4 18h16" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile / tablet menu -->
  @if (mobileOpen()) {
    <div
      id="mobile-menu"
      class="glass-surface absolute inset-x-0 top-full mt-2 flex flex-col gap-1 rounded-box p-2 lg:hidden"
      animate.enter="menu-enter"
      animate.leave="menu-leave"
    >
      @for (tab of tabs; track tab.path) {
        <a [routerLink]="tab.path" routerLinkActive="nav-tab-active" class="nav-tab py-2.5" (click)="mobileOpen.set(false)">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="tab.icon" />
          </svg>
          {{ tab.label }}
        </a>
      }
      <div class="my-1 h-px bg-base-content/10"></div>
      <a routerLink="/settings" routerLinkActive="nav-tab-active" class="nav-tab py-2.5" (click)="mobileOpen.set(false)">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" />
        </svg>
        Your space
      </a>
    </div>
  }
</header>
